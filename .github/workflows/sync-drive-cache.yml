name: Build GitHub knowledge cache

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "COMMANDS.md"
      - "AGENTS.md"
      - "SHARED/**"
      - "AGENTS/**"
      - "TASKS/publishing_policy.json"
      - "TASKS/retry_policy.json"
      - "TASKS/model_fallbacks.json"
      - "TASKS/notification_policy.json"
      - "CACHE/**"
      - "scripts/sync_drive_cache.py"
      - ".github/workflows/sync-drive-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-knowledge-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate cache
        run: python scripts/sync_drive_cache.py
      - name: Store cache bundle as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-cache-${{ github.sha }}
          path: dist/knowledge-cache/
          if-no-files-found: error
          retention-days: 90
